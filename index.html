<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernando Daniel Murillo</title>
    <style>
        /* Estilos CSS: Temática Tecnológica */
        body {
            background-color: #0d1117; /* Fondo oscuro estilo editor de código */
            color: #c9d1d9; /* Texto claro */
            font-family: 'Courier New', Courier, monospace; /* Fuente de estilo consola/terminal */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .contenedor-tech {
            text-align: center;
            background-color: #161b22;
            padding: 50px 70px;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1); /* Resplandor sutil */
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: #00ffcc; /* Verde/Cian Neón */
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5), 
                         0 0 20px rgba(0, 255, 204, 0.3); /* Efecto de brillo (Glow) */
        }

        /* Subtítulo simulando código */
        .subtitulo {
            font-size: 1.2rem;
            margin-top: 15px;
            color: #8b949e;
        }

        /* Pequeño detalle de terminal */
        .consola {
            margin-top: 30px;
            background-color: #000000;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #00ffcc;
            font-size: 0.9rem;
            text-align: left;
            color: #4af626; /* Verde terminal */
        }

        /* Animación de cursor parpadeante */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #4af626;
            animation: parpadeo 1s step-end infinite;
        }

        @keyframes parpadeo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="contenedor-tech">
        <h1>FERNANDO</h1>
        <div class="subtitulo">&lt; Desarrollador Full Stack/ Modelador 3d /&gt;</div>
        
        <div class="consola">
            <span style="color: #ff7b72;">root@servidor</span>:<span style="color: #79c0ff;">~</span>$ iniciando sistema...<br>
            <span style="color: #ff7b72;">root@servidor</span>:<span style="color: #79c0ff;">~</span>$ acceso concedido a Fernando Murillo <span class="cursor"></span>
        </div>
    </div>

</body>
</html>
